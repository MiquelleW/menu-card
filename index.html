<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Card</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <h1>The Snack Feed - Menu Card</h1>

    <form id="menu-form">
      <label for="menu-input">Paste your menu as JSON</label>

      <textarea id="menu-input" rows="8">
      [
        {"name": "Pizza Dip & Garlic Knots", "price": 11.99},
        {"name": "Philly Cheesesteak Eggrolls", "price": 8.99},
        {"name": "Loaded Potato Cheese Balls", "price": 7.99},
        {"name": "Cheeseburger Loaded Fries", "price": 10.99}
      ]
      </textarea>

      <button type="submit">Show my menu</button>
    </form>

    <p id="count"></p>
    <p id="menu-text"></p>

    <script src="script.js"></script>
  </body>
</html>
